site_name: Joplin for Mere Mortals
site_description: An open-source note-taking app that keeps your notes on your own machines. Notebooks, Markdown notes, tags and attachments, sync through a folder, WebDAV or a server you choose, and end-to-end encryption, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/joplin-for-mere-mortals/
